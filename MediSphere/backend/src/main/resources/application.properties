# ===================================================================
# MediSphere / HealSync Spring Boot Server Configuration
# ===================================================================
server.port=8081
spring.application.name=healsync-backend

# ===================================================================
# Database Configuration - PostgreSQL
# ===================================================================
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/healsync
spring.datasource.username=postgres
spring.datasource.password=k@vi2211
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Option 3: MySQL Configuration (Uncomment to use MySQL Database)
# spring.datasource.url=jdbc:mysql://localhost:3306/medispheredb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===================================================================
# JPA & Hibernate Settings
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
